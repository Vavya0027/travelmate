<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelMate</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Sample Styling (you can move this to your style.css later) */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 3em;
    }

    header nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
    }

    header nav a:hover {
      text-decoration: underline;
    }

    .contact-form {
      background-color: white;
      margin: 20px auto;
      padding: 30px;
      border-radius: 8px;
      width: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .contact-form h2 {
      font-size: 2em;
      text-align: center;
      color: #333;
    }

    .contact-form label {
      font-size: 1.2em;
      margin-bottom: 8px;
      color: #333;
      display: block;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }

    .contact-form button {
      background-color: #00aaff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.1em;
      cursor: pointer;
      border-radius: 5px;
      width: 100%;
    }

    .contact-form button:hover {
      background-color: #0077cc;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
      position: relative;
      bottom: 0;
      width: 100%;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .contact-form {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>TravelMate</h1>
    <p>Your smart, budget-friendly travel assistant</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="stays.html">Stays</a>
      <a href="guides.html">Local Guides</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Contact Form -->
  <section class="contact-form">
    <h2>Get in Touch</h2>
    <form action="submit_form.php" method="POST" id="contact-form">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your name">

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">

      <label for="phone">Your Phone Number (Optional):</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number (Optional)" pattern="[0-9]{10}">

      <label for="message">Your Message:</label>
      <textarea id="message" name="message" required placeholder="Enter your message" rows="4"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>TravelMate &copy; 2025 | Empowering local travel | Built by Group 4 TMU</p>
  </footer>

</body>
</html>
